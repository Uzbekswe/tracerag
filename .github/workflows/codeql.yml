name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b  # v3.28.17
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@0fa1882f994fbd81a47ab0804f93354f5ea40147  # v3.28.17
        with:
          upload: false
