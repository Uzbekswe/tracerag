name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6  # v6.6.1
        with:
          version: "0.11.15"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Deterministic tests
        run: uv run pytest -q
      - name: Package build
        run: uv build
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt > /tmp/tracerag-runtime-requirements.txt
      - name: Dependency audit
        run: uv run pip-audit -r /tmp/tracerag-runtime-requirements.txt
      - name: Bandit medium/high severity
        run: uv run bandit -q -r tracerag -ll
