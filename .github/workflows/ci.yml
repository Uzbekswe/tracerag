name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.15"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Deterministic tests
        run: uv run pytest -q
      - name: Package build
        run: uv build
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt > /tmp/tracerag-runtime-requirements.txt
      - name: Dependency audit
        run: uv run pip-audit -r /tmp/tracerag-runtime-requirements.txt
      - name: Bandit medium/high severity
        run: uv run bandit -q -r tracerag -ll
