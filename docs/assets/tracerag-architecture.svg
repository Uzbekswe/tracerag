<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">TraceRAG ingestion and question-answering architecture</title>
  <desc id="desc">Two local flows: documents are parsed, embedded, staged, validated, and atomically activated; questions use vector and BM25 retrieval, reciprocal-rank fusion, an evidence threshold, and local generation or refusal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#49657f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16324a" flood-opacity=".15"/>
    </filter>
    <style>
      .canvas { fill:#f7fafc; }
      .title { font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#16324a; }
      .section { font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#355a78; letter-spacing:.4px; }
      .label { font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#16324a; }
      .small { font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#476276; }
      .box { fill:#fff; stroke:#9bb3c7; stroke-width:1.5; rx:10; filter:url(#shadow); }
      .model { fill:#eef6ff; stroke:#5b8db8; }
      .stage { fill:#edf8f2; stroke:#62a17b; }
      .gate { fill:#fff8e7; stroke:#c79a35; }
      .refusal { fill:#fff0f0; stroke:#c66d72; }
      .line { fill:none; stroke:#49657f; stroke-width:2; marker-end:url(#arrow); }
      .dashed { fill:none; stroke:#7b94a8; stroke-width:1.8; stroke-dasharray:6 5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="canvas" width="1280" height="760"/>
  <text class="title" x="48" y="48">TraceRAG · local evidence pipeline</text>
  <text class="small" x="48" y="72">Every active index is staged and validated before it replaces the last known-good generation.</text>

  <text class="section" x="48" y="116">INGESTION · safe index activation</text>
  <rect class="box" x="48" y="138" width="150" height="66"/>
  <text class="label" x="123" y="166" text-anchor="middle">Documents</text>
  <text class="small" x="123" y="186" text-anchor="middle">Markdown · text PDF</text>
  <rect class="box" x="242" y="138" width="170" height="66"/>
  <text class="label" x="327" y="166" text-anchor="middle">Parse + chunk</text>
  <text class="small" x="327" y="186" text-anchor="middle">headings preserved</text>
  <rect class="box" x="456" y="138" width="170" height="66"/>
  <text class="label" x="541" y="166" text-anchor="middle">Content identity</text>
  <text class="small" x="541" y="186" text-anchor="middle">hash + schema versions</text>
  <rect class="box stage" x="670" y="138" width="188" height="66"/>
  <text class="label" x="764" y="166" text-anchor="middle">Embedding cache</text>
  <text class="small" x="764" y="186" text-anchor="middle">reuse exact chunks</text>
  <rect class="box model" x="902" y="138" width="160" height="66"/>
  <text class="label" x="982" y="166" text-anchor="middle">Ollama</text>
  <text class="small" x="982" y="186" text-anchor="middle">nomic-embed-text</text>
  <rect class="box stage" x="1106" y="138" width="126" height="66"/>
  <text class="label" x="1169" y="166" text-anchor="middle">Prepared</text>
  <text class="small" x="1169" y="186" text-anchor="middle">generation</text>
  <path class="line" d="M198 171 H242"/><path class="line" d="M412 171 H456"/><path class="line" d="M626 171 H670"/><path class="line" d="M858 171 H902"/><path class="line" d="M1062 171 H1106"/>

  <rect class="box stage" x="220" y="256" width="250" height="78"/>
  <text class="label" x="345" y="287" text-anchor="middle">Staged generation</text>
  <text class="small" x="345" y="308" text-anchor="middle">SQLite vectors · BM25 · source state</text>
  <rect class="box gate" x="515" y="256" width="190" height="78"/>
  <text class="label" x="610" y="287" text-anchor="middle">Validate</text>
  <text class="small" x="610" y="308" text-anchor="middle">count · dimension · identity</text>
  <rect class="box stage" x="750" y="256" width="250" height="78"/>
  <text class="label" x="875" y="287" text-anchor="middle">Atomic activation</text>
  <text class="small" x="875" y="308" text-anchor="middle">manifest becomes commit point</text>
  <rect class="box" x="1045" y="256" width="150" height="78"/>
  <text class="label" x="1120" y="287" text-anchor="middle">Active index</text>
  <text class="small" x="1120" y="308" text-anchor="middle">queryable generation</text>
  <path class="line" d="M1169 204 V238 H345 V256"/><path class="line" d="M470 295 H515"/><path class="line" d="M705 295 H750"/><path class="line" d="M1000 295 H1045"/>

  <text class="section" x="48" y="404">QUESTION ANSWERING · evidence before generation</text>
  <rect class="box" x="48" y="430" width="150" height="66"/>
  <text class="label" x="123" y="458" text-anchor="middle">Question</text>
  <text class="small" x="123" y="478" text-anchor="middle">tracerag ask</text>
  <rect class="box model" x="242" y="430" width="180" height="66"/>
  <text class="label" x="332" y="458" text-anchor="middle">Query embedding</text>
  <text class="small" x="332" y="478" text-anchor="middle">Ollama · nomic</text>
  <rect class="box" x="466" y="430" width="150" height="66"/>
  <text class="label" x="541" y="458" text-anchor="middle">Vector search</text>
  <text class="small" x="541" y="478" text-anchor="middle">active SQLite</text>
  <rect class="box" x="466" y="530" width="150" height="66"/>
  <text class="label" x="541" y="558" text-anchor="middle">BM25 search</text>
  <text class="small" x="541" y="578" text-anchor="middle">exact terms</text>
  <rect class="box stage" x="666" y="480" width="190" height="66"/>
  <text class="label" x="761" y="508" text-anchor="middle">RRF fusion</text>
  <text class="small" x="761" y="528" text-anchor="middle">hybrid top-k evidence</text>
  <rect class="box gate" x="906" y="480" width="170" height="66"/>
  <text class="label" x="991" y="508" text-anchor="middle">Evidence threshold</text>
  <text class="small" x="991" y="528" text-anchor="middle">supported?</text>
  <rect class="box model" x="1126" y="430" width="106" height="66"/>
  <text class="label" x="1179" y="458" text-anchor="middle">qwen3:4b</text>
  <text class="small" x="1179" y="478" text-anchor="middle">local answer</text>
  <rect class="box refusal" x="1126" y="530" width="106" height="66"/>
  <text class="label" x="1179" y="558" text-anchor="middle">Refusal</text>
  <text class="small" x="1179" y="578" text-anchor="middle">no evidence</text>
  <path class="line" d="M198 463 H242"/><path class="line" d="M422 463 H466"/><path class="line" d="M422 463 H440 V563 H466"/><path class="line" d="M616 463 H640 V513 H666"/><path class="line" d="M616 563 H640 V513 H666"/><path class="line" d="M856 513 H906"/><path class="line" d="M1076 513 H1100 V463 H1126"/><path class="line" d="M1076 513 H1100 V563 H1126"/>
  <path class="dashed" d="M1120 334 V388 H541 V430"/>

  <rect class="box" x="48" y="660" width="1184" height="54"/>
  <text class="label" x="70" y="693">Evaluation and evidence checks</text>
  <text class="small" x="278" y="693">exact source + heading Recall@5 · citation validity · semantic review · benchmark provenance</text>
</svg>
